<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" width="1240" height="580" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="1240" height="580" fill="#ffffff"/>
<text x="620.0" y="56" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2328">Alarm State Machine</text>
<path d="M240.0,250.0 L300.0,250.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M500.0,250.0 L580.0,250.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="540" y="240" font-size="12" fill="#4b5563" text-anchor="middle">motion</text>
<path d="M860.0,250.0 L940.0,250.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="900" y="240" font-size="12" fill="#4b5563" text-anchor="middle">valid tag</text>
<path d="M720.0,300.0 L720.0,400.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="732" y="356" font-size="12" fill="#4b5563" text-anchor="start">10 s elapsed, motion present</text>
<path d="M580.0,450.0 L400.0,450.0 L400.0,300.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390" y="440" font-size="12" fill="#4b5563" text-anchor="end">no motion for 5 s · emits INTRUDER_GONE</text>
<path d="M720.0,200.0 L720.0,150.0 L400.0,150.0 L400.0,200.0" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="560" y="140" font-size="12" fill="#4b5563" text-anchor="middle">no motion for 5 s · no message</text>
<rect x="42" y="203" width="200" height="100" rx="8" fill="#e6e8ec"/>
<rect x="40" y="200" width="200" height="100" rx="8" fill="#f6f7f9" stroke="#d4d7dd" stroke-width="1.2"/>
<text x="140.0" y="237.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">Calibrating</text>
<text x="140.0" y="257.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">50 s after power-up</text>
<text x="140.0" y="274.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">emits SENSOR ACTIVE</text>
<rect x="302" y="203" width="200" height="100" rx="8" fill="#e6e8ec"/>
<rect x="300" y="200" width="200" height="100" rx="8" fill="#f6f7f9" stroke="#d4d7dd" stroke-width="1.2"/>
<text x="400.0" y="237.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">Idle</text>
<text x="400.0" y="257.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">monitoring the</text>
<text x="400.0" y="274.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">PIR sensor</text>
<rect x="582" y="203" width="280" height="100" rx="8" fill="#e6e8ec"/>
<rect x="580" y="200" width="280" height="100" rx="8" fill="#f6f7f9" stroke="#d4d7dd" stroke-width="1.2"/>
<text x="720.0" y="228.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">Arming (yellow)</text>
<text x="720.0" y="248.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">servo locks · 3 beeps</text>
<text x="720.0" y="265.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">tag polled while motion</text>
<text x="720.0" y="282.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">emits ALARM_ACTIVATED</text>
<rect x="942" y="203" width="260" height="100" rx="8" fill="#e6e8ec"/>
<rect x="940" y="200" width="260" height="100" rx="8" fill="#f6f7f9" stroke="#d4d7dd" stroke-width="1.2"/>
<text x="1070.0" y="228.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">Disarmed</text>
<text x="1070.0" y="248.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">servo unlocks · latched</text>
<text x="1070.0" y="265.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">until reboot</text>
<text x="1070.0" y="282.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">emits ALARM_DISABLED</text>
<rect x="582" y="403" width="280" height="100" rx="8" fill="#e6e8ec"/>
<rect x="580" y="400" width="280" height="100" rx="8" fill="#f6f7f9" stroke="#d4d7dd" stroke-width="1.2"/>
<text x="720.0" y="428.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">Alarm (red)</text>
<text x="720.0" y="448.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">continuous tone</text>
<text x="720.0" y="465.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">tag ignored</text>
<text x="720.0" y="482.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#4b5563">emits INTRUDER_ALERT</text>
<text x="620.0" y="562" text-anchor="middle" font-size="13" font-style="italic" fill="#4b5563">The tag is only read while the PIR reports motion, and a disarm lasts until the board is restarted.</text>
</svg>