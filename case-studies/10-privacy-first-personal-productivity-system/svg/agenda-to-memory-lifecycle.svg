<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1240" height="920" fill="#ffffff"/>
  <text x="620" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700" fill="#111827">Agenda-to-Memory Lifecycle</text>
  <text x="620" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="13" fill="#6b7280">Reusing planned-event context to create a durable personal memory without duplicate entry</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="135" width="250" height="120" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="195" y="167" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">1. Create Agenda Event</text>
    <text x="195" y="195" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Title · date · time · place · notes</text>
    <text x="195" y="218" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Future events remain planning records</text>
    <text x="195" y="238" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Stored in localStorage</text>
  </g>

  <line x1="320" y1="195" x2="385" y2="195" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="390" y="135" width="250" height="120" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="515" y="167" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">2. Event Becomes Eligible</text>
    <text x="515" y="195" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Date has arrived or already passed</text>
    <text x="515" y="218" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Agenda shows a conversion star</text>
    <text x="515" y="238" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Recuerdos marks pending days</text>
  </g>

  <line x1="640" y1="195" x2="705" y2="195" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="710" y="135" width="250" height="120" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="835" y="167" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">3. Start Conversion</text>
    <text x="835" y="195" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Memory form is pre-filled from event</text>
    <text x="835" y="218" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Title · date · place · notes</text>
    <text x="835" y="238" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Category is suggested automatically</text>
  </g>

  <line x1="960" y1="195" x2="1025" y2="195" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="1030" y="135" width="140" height="120" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="1100" y="167" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">4. Enrich</text>
    <text x="1100" y="195" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Photos</text>
    <text x="1100" y="216" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Coordinates</text>
    <text x="1100" y="237" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Category edits</text>
  </g>

  <!-- Save -->
  <line x1="1100" y1="255" x2="1100" y2="325" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="920" y="330" width="250" height="130" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="1045" y="362" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">5. Save Memory</text>
    <text x="1045" y="390" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Memory metadata stored locally</text>
    <text x="1045" y="412" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Photos stored in IndexedDB</text>
    <text x="1045" y="434" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Event and memory remain linked</text>
  </g>

  <!-- Linked state -->
  <line x1="920" y1="395" x2="745" y2="395" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="490" y="330" width="255" height="130" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="617.5" y="362" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Linked Lifecycle State</text>
    <text x="617.5" y="390" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Agenda shows filled star</text>
    <text x="617.5" y="412" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Pending-conversion marker disappears</text>
    <text x="617.5" y="434" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">User can jump from event to memory</text>
  </g>

  <!-- Decisions -->
  <line x1="617.5" y1="460" x2="617.5" y2="515" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <polygon points="617.5,520 755,585 617.5,650 480,585" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="617.5" y="575" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">What Changes Later?</text>
    <text x="617.5" y="598" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Event deletion or memory deletion</text>
  </g>

  <!-- Event deleted -->
  <line x1="480" y1="585" x2="300" y2="585" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="390" y="568" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="700" fill="#6b7280">EVENT DELETED</text>

  <g filter="url(#shadow)">
    <rect x="70" y="530" width="230" height="110" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="185" y="560" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">Memory Remains</text>
    <text x="185" y="587" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Deleting the plan does not erase</text>
    <text x="185" y="607" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">the historical record</text>
  </g>

  <!-- Memory deleted -->
  <line x1="755" y1="585" x2="930" y2="585" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="842" y="568" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="700" fill="#6b7280">MEMORY DELETED</text>

  <g filter="url(#shadow)">
    <rect x="930" y="530" width="240" height="110" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="1050" y="560" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">Event Becomes Eligible Again</text>
    <text x="1050" y="587" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">The link is removed</text>
    <text x="1050" y="607" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">and conversion is offered again</text>
  </g>

  <!-- Data mapping -->
  <rect x="70" y="700" width="1100" height="145" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8 7"/>
  <text x="620" y="730" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#374151">Data and Product Rules</text>

  <text x="100" y="762" font-family="Arial" font-size="12" fill="#4b5563">• Future events never appear as memory candidates.</text>
  <text x="100" y="786" font-family="Arial" font-size="12" fill="#4b5563">• Only unconverted past events are shown as pending in Recuerdos.</text>
  <text x="100" y="810" font-family="Arial" font-size="12" fill="#4b5563">• Structured event and memory records remain in localStorage.</text>

  <text x="640" y="762" font-family="Arial" font-size="12" fill="#4b5563">• Photos remain in IndexedDB and are attached only when the memory is saved.</text>
  <text x="640" y="786" font-family="Arial" font-size="12" fill="#4b5563">• Category mapping reduces manual work but remains editable before saving.</text>
  <text x="640" y="810" font-family="Arial" font-size="12" fill="#4b5563">• Linking avoids duplicate entry while preserving independent deletion rules.</text>
</svg>
