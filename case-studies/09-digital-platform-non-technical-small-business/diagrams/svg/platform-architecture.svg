    <text x="420" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">CRM Interface</text>
    <text x="420" y="459" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Contacts · Opportunities</text>
    <text x="420" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Actions · Internal notes</text>
  </g>

