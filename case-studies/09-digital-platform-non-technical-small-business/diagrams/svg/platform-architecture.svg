  <rect x="285" y="255" width="600" height="262" rx="20" fill="none" stroke="#9ca3af" stroke-dasharray="8 7" stroke-width="1.5"/>
  <text x="585" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#6b7280">AUTHENTICATED INTERNAL WORKFLOWS</text>

  <!-- Connections -->
  <line x1="240" y1="184" x2="305" y2="184" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="240" y1="314" x2="305" y2="314" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="240" y1="444" x2="305" y2="444" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <line x1="535" y1="191" x2="595" y2="191" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="535" y1="321" x2="595" y2="321" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="535" y1="451" x2="595" y2="451" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <line x1="865" y1="267" x2="925" y2="267" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="865" y1="457" x2="925" y2="457" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Delivery -->
  <text x="325" y="612" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6b7280">DELIVERY AND EVOLUTION</text>

  <g filter="url(#shadow)">
    <rect x="305" y="635" width="230" height="76" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="420" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">GitHub Actions</text>
    <text x="420" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Validation and Firebase deployment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="595" y="635" width="270" height="76" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="730" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Private Development Repository</text>
    <text x="730" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Access limited to the three-person team</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="925" y="635" width="245" height="76" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="1047.5" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Future Shopify Integration</text>
    <text x="1047.5" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Production commerce capabilities</text>
  </g>

  <line x1="595" y1="673" x2="535" y2="673" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="865" y1="673" x2="925" y2="673" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
