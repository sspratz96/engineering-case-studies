    <text x="1047.5" y="179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111827">Google Sheets</text>

    <text x="955" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">• Products and public content</text>
    <text x="955" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">• Workshops and schedules</text>
    <text x="955" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">• Reservations and capacity</text>
    <text x="955" y="314" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">• Audit records</text>
    <text x="955" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">• CRM data</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="925" y="425" width="245" height="72" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="1047.5" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Gmail</text>
    <text x="1047.5" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Confirmations and notifications</text>
  </g>

