  <g filter="url(#shadow)">
    <rect x="305" y="275" width="230" height="92" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="420" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Admin Interface</text>
    <text x="420" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Workshops · Products · Content</text>
    <text x="420" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Bookings · Gallery</text>
  </g>

