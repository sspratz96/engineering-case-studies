    <text x="730" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111827">Application and Business Logic</text>

    <rect x="625" y="208" width="210" height="42" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="730" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">Public content endpoints</text>

    <rect x="625" y="265" width="210" height="42" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="730" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">Reservation and capacity rules</text>

    <rect x="625" y="322" width="210" height="42" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="730" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">Authentication validation</text>

    <rect x="625" y="379" width="210" height="42" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="730" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">CRM and administrative operations</text>

    <rect x="625" y="436" width="210" height="42" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="730" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151">Email and audit automation</text>
