<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1240" height="760" fill="#ffffff"/>
  <text x="620" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700" fill="#111827">Digital Platform Architecture</text>
  <text x="620" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="13" fill="#6b7280">Low-cost architecture for public experiences, internal operations and governed data access</text>

  <!-- Users -->
  <text x="90" y="122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6b7280">USERS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="170" height="78" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="155" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Public Visitors</text>
    <text x="155" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Families, schools, customers</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="275" width="170" height="78" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="155" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Founders</text>
    <text x="155" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Content and operations</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="405" width="170" height="78" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="155" y="436" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Internal Team</text>
    <text x="155" y="459" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">CRM and administration</text>
  </g>

  <!-- Frontend -->
  <text x="325" y="122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6b7280">FIREBASE HOSTING</text>

  <g filter="url(#shadow)">
    <rect x="305" y="145" width="230" height="92" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="420" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Public Experience</text>
    <text x="420" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Bichos Club · Products</text>
    <text x="420" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Taller de Bichos · B2B</text>
