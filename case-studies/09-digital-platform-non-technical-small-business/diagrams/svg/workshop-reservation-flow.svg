<filter id="s" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".1"/></filter>
</defs>
<rect width="1240" height="980" fill="#fff"/>
<text x="620" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#111827">Workshop Reservation Flow</text>
<text x="620" y="76" text-anchor="middle" font-family="Arial" font-size="13" fill="#6b7280">From public request to consistent capacity update and confirmation</text>

<g filter="url(#s)"><rect x="420" y="110" width="400" height="72" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="620" y="139" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Visitor Selects a Workshop</text><text x="620" y="161" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Date, participant count and contact details</text></g>
<line x1="620" y1="182" x2="620" y2="220" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>

<g filter="url(#s)"><rect x="420" y="225" width="400" height="72" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="620" y="254" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Retrieve Current Availability</text><text x="620" y="276" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Read workshop status, capacity and active schedule</text></g>
<line x1="620" y1="297" x2="620" y2="335" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>

<g filter="url(#s)"><polygon points="620,335 790,405 620,475 450,405" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="620" y="395" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Request Valid?</text><text x="620" y="418" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Fields, date, status and participant count</text></g>
<line x1="450" y1="405" x2="295" y2="405" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/><text x="372" y="390" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="700" fill="#6b7280">NO</text>
<g filter="url(#s)"><rect x="70" y="366" width="225" height="78" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="182.5" y="396" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">Return Validation Error</text><text x="182.5" y="419" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">No reservation or capacity change</text></g>

<line x1="620" y1="475" x2="620" y2="515" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/><text x="643" y="501" font-family="Arial" font-size="11.5" font-weight="700" fill="#6b7280">YES</text>

<g filter="url(#s)"><polygon points="620,520 790,590 620,660 450,590" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="620" y="579" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Duplicate or Full?</text><text x="620" y="602" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Existing booking or insufficient capacity</text></g>
<line x1="790" y1="590" x2="945" y2="590" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/><text x="867" y="575" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="700" fill="#6b7280">YES</text>
<g filter="url(#s)"><rect x="945" y="551" width="225" height="78" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="1057.5" y="581" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">Reject Request</text><text x="1057.5" y="604" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Explain duplicate or capacity issue</text></g>

<line x1="620" y1="660" x2="620" y2="700" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/><text x="643" y="686" font-family="Arial" font-size="11.5" font-weight="700" fill="#6b7280">NO</text>
<g filter="url(#s)"><rect x="400" y="705" width="440" height="84" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="620" y="735" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Acquire Lock and Re-check State</text><text x="620" y="758" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Prevent concurrent requests from consuming the same remaining capacity</text><text x="620" y="775" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Verify revision and availability immediately before writing</text></g>
<line x1="620" y1="789" x2="620" y2="825" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>

<rect x="235" y="830" width="770" height="112" rx="18" fill="none" stroke="#9ca3af" stroke-dasharray="8 7" stroke-width="1.5"/>
<g filter="url(#s)"><rect x="265" y="850" width="210" height="72" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="370" y="879" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">Update Capacity</text><text x="370" y="902" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Consume requested places</text></g>
<line x1="475" y1="886" x2="515" y2="886" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="515" y="850" width="210" height="72" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="620" y="879" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">Store Reservation</text><text x="620" y="902" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Create booking and audit record</text></g>
<line x1="725" y1="886" x2="765" y2="886" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="765" y="850" width="210" height="72" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="870" y="879" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111827">Send Confirmation</text><text x="870" y="902" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#4b5563">Return success and notify family</text></g>
<text x="620" y="958" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="700" fill="#6b7280">CONSISTENT WRITE SEQUENCE</text>
</svg>